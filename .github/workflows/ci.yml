name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=phishlens --cov-report=term-missing
      - name: Smoke test CLI on samples
        run: |
          phishlens analyze samples/*.eml -f md -o reports/ || test $? -le 2
          ls reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phishlens:ci .
      - run: |
          docker run -d -p 5000:5000 --name pl phishlens:ci
          for i in $(seq 1 20); do curl -fs localhost:5000/healthz && break; sleep 1; done
          curl -fs -X POST --data-binary @samples/02_credential_harvest.eml localhost:5000/api/analyze | grep -q MALICIOUS
