[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishlens"
version = "1.0.0"
description = "Phishing e-mail analyzer for SOC triage: header auth, URL & attachment heuristics, threat intel, MITRE ATT&CK mapped reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fatih Kaya" }]
requires-python = ">=3.10"
keywords = ["phishing", "soc", "email-security", "dfir", "blue-team", "threat-intelligence", "mitre-attack"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Environment :: Console",
  "Framework :: Flask",
]
dependencies = ["requests>=2.31", "Flask>=3.0", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
phishlens = "phishlens.cli:main"

[project.urls]
Homepage = "https://github.com/fat1hkaya/phishlens"

[tool.setuptools.packages.find]
include = ["phishlens*"]

[tool.setuptools.package-data]
phishlens = ["web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S324"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"samples/*" = ["S"]
